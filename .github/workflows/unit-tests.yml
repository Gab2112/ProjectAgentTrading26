name: Test automatici Python (solo sviluppo)

on:
  pull_request:
  push:
    branches: [main, gianluca, modulo-C, integrazione-finale]

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      # CI receives only Git-tracked raw data; frozen ML binaries/OOS artifacts
      # are distributed separately in the submission archive.
      - name: Prepara la pipeline storica A1/A2 per i test
        run: python -c "from main import run_pipeline; run_pipeline(level='ALL')"
      - name: Esegui tutti i test del repository
        run: python -m unittest discover -s tests -p 'test_*.py' -q
