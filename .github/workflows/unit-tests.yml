name: Test automatici Python (solo sviluppo)

on:
  pull_request:
  push:
    branches: [main, gianluca, modulo-C]

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Esegue i test senza consultare la validation o il test finale
        run: python -m unittest discover -s tests -p 'test_*.py' -q
