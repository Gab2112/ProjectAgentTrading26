name: Release scientific integrity and regression tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Audit exact original release
        run: python main.py --release-action audit
      - name: Verify frozen agent ensemble loading
        run: python main.py --release-action verify-models
      - name: Replay preselected original OOS
        run: python main.py --release-action replay
      - name: Run focused and retrospective regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q
