
# ============================================================
# PROJECT CONFIGURATION
# Regime-Aware Multi-Asset Allocation
# ============================================================

project:
  name: ProjectAgentTrading26
  version: "0.2"
  random_seed: 42

research:
  working_candidate: regime_aware_multi_asset_allocation
  market_scope: US
  objective: risk_adjusted_performance_and_downside_protection

# ------------------------------------------------------------
# INVESTABLE UNIVERSE
# ------------------------------------------------------------

universe:
  traded_assets:
    us_equities:
      ticker: SPY
      role: equity_growth

    intermediate_treasuries:
      ticker: IEF
      role: intermediate_duration_bonds

    gold:
      ticker: GLD
      role: gold_diversification

    short_treasuries:
      ticker: SHY
      role: short_duration_defensive

# ------------------------------------------------------------
# FREQUENCY AND DATA
# ------------------------------------------------------------

frequency:
  raw_market_data: daily
  macro_data: native
  strategy: weekly
  rebalance: weekly

data:
  start_date: "2004-01-01"
  end_date: null

  market_source:
    provider: yfinance
    auto_adjust: true

  macro_source:
    provider: FRED

  # Candidate macro data for Level B
  rates:
    policy_rate: FEDFUNDS
    treasury_3m: DGS3MO
    treasury_2y: DGS2
    treasury_5y: DGS5
    treasury_10y: DGS10
    treasury_30y: DGS30

  inflation:
    cpi: CPIAUCSL
    core_cpi: CPILFESL
    breakeven_5y: T5YIE
    breakeven_10y: T10YIE

  stress:
    equity_implied_volatility: VIXCLS

# ------------------------------------------------------------
# FEATURES AND SIGNALS
# ------------------------------------------------------------

features:
  return_frequency: daily
  macro_point_in_time_verified: false

signals:
  allowed_values: [-1, 0, 1]

  convention:
    long: 1
    flat: 0
    short: -1

# ------------------------------------------------------------
# PORTFOLIO CONSTRAINTS
# ------------------------------------------------------------

portfolio:
  long_only: true
  fully_invested: true
  allow_short: false
  leverage: 1.0

# ------------------------------------------------------------
# LEVEL A1 - BENCHMARKS
# ------------------------------------------------------------

benchmarks:
  spy_buy_and_hold:
    weights:
      SPY: 1.0
      IEF: 0.0
      GLD: 0.0
      SHY: 0.0
    rebalance: none

  sixty_forty:
    weights:
      SPY: 0.60
      IEF: 0.40
      GLD: 0.0
      SHY: 0.0
    rebalance: weekly

  equal_weight:
    weights:
      SPY: 0.25
      IEF: 0.25
      GLD: 0.25
      SHY: 0.25
    rebalance: weekly

  equal_weight_buy_and_hold:
    weights:
      SPY: 0.25
      IEF: 0.25
      GLD: 0.25
      SHY: 0.25
    rebalance: none

# ------------------------------------------------------------
# LEVEL A2 - VOLATILITY CONTROL
# ------------------------------------------------------------

strategies:
  A1:
    enabled: true
    method: static_benchmarks

  A2:
    enabled: true
    method: volatility_constrained_allocation

    reference_portfolio: equal_weight
    covariance_window: 126
    annualization_factor: 252
    target_volatility: 0.08

    objective: minimum_squared_distance
    optimizer: cvxpy
    solver: CLARABEL

    fallback: minimum_variance

  # ----------------------------------------------------------
  # LEVEL B - MACRO-FINANCIAL REGIMES
  # ----------------------------------------------------------

  B:
    enabled: true
    method: regime_based_allocation

    research_mode: exploratory_training_only
    position_mode: long_short

    annual_borrow_rate: 0.01
    additional_margin_rate: 0.50
    cash_interest_rate: 0.0

    regime_dimensions:
      - inflation_pressure
      - financial_stress

    regime_model: null
    regime_thresholds: null
    allocation_rules: null

    # Il modulo src/regime_clustering.py produce i regimi, ma NON sono
    # ancora usati da alcuna allocazione: clustering_enabled resta false.
    clustering_enabled: false
    clustering_method: gaussian_mixture

    # Configurazione congelata (vedi decision log): non modificare dopo
    # aver osservato risultati di strategia.
    clustering:
      n_clusters: 3
      covariance_type: diag      # varianza per variabile, senza correlazioni
      unknown_quantile: 0.02     # meno verosimile del 2% del training -> non riconosciuta
      order_by: treasury_2y_change_13w
      change_weeks: 13
      volatility_weeks: 13
      zscore_weeks: 156          # 3 anni
      zscore_min_weeks: 104
      features:
        - treasury_2y_change_13w
        - curve_10y_2y_change_13w
        - rate_volatility_13w
        - treasury_2y_zscore_3y
        - curve_10y_2y_zscore_3y

  # ----------------------------------------------------------
  # LEVEL C - ML AND AI AGENTS
  # ----------------------------------------------------------

  C:
    enabled: false
    method: machine_learning_allocation

    prediction_target: null
    forecasting_model: null
    sentiment_enabled: false

    # Agente SVM (src/agents/SVM_agent.py): segnali walk-forward annuali
    # out-of-fold per ogni ETF, usati dall'orchestratore (src/agents/train.py).
    svm_agent:
      horizon_weeks: 4           # previsione: il prezzo sarà più alto tra 4 settimane?
      first_test_year: 2010      # primo anno con previsioni out-of-fold (almeno 3 anni di storia)
      min_train_weeks: 156
      cv_splits: 4               # TimeSeriesSplit interno, gap = horizon_weeks
      C_values: [0.1, 1.0, 10.0]
      gamma_values: [scale, 0.01, 0.1]
      class_weight: none         # 'balanced' forzava troppi segnali -1 (vedi decision log)
      neutral_band: 0.25         # |punteggio scalato| <= 0.25 -> segnale 0
      long_only: false           # true: i segnali -1 diventano 0
      use_macro_features: true   # variazioni 2Y e curva, volatilità tassi

# ------------------------------------------------------------
# TEMPORAL VALIDATION
# ------------------------------------------------------------

validation:
  method: chronological

  train_start: "2005-05-20"
  train_end: "2020-12-30"

  validation_start: "2020-12-31"
  validation_end: "2020-12-31"

  oos_start: "2021-01-01"

  walk_forward: false
  development_only: true

# ------------------------------------------------------------
# EXECUTION AND TRANSACTION COSTS
# ------------------------------------------------------------

execution:
  signal_frequency: weekly
  execution_rule: next_available_trading_open

  initial_capital: 100000.0

  commission_bps: 2
  slippage_bps: 1

  cost_basis: traded_notional

# ------------------------------------------------------------
# PERFORMANCE EVALUATION
# ------------------------------------------------------------

evaluation:
  annualization_factor: 252
  risk_free_rate: 0.0
  evaluate_oos: false

  metrics:
    - CAGR
    - annualized_volatility
    - sharpe_ratio
    - sortino_ratio
    - maximum_drawdown
    - turnover
    - transaction_costs

# ------------------------------------------------------------
# AI AGENTS
# ------------------------------------------------------------

agents:
  planned: true
  enabled: false

  roles:
    - orchestrator
    - macro_agent
    - regime_agent
    - strategy_agent
    - risk_agent
    - critic_agent

# ------------------------------------------------------------
# PATHS
# ------------------------------------------------------------

paths:
  raw_data: data/raw
  processed_data: data/processed
  signals: data/signals
  results: data/results

# ------------------------------------------------------------
# PIPELINE
# ------------------------------------------------------------

pipeline:
  active_level: A1
  run_data_acquisition: false
  legacy_treasury_enabled: false
